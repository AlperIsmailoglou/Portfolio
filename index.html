<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Professional Portfolio</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Google Fonts import for easy font customization -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>

    <header class="hero">
        <h1>Hello, I'm [Your Name].</h1>
        <p>I build solutions. Here are my academic and personal projects.</p>
    </header>

    <main>
        <!-- This grid is what the CMS will eventually fill automatically -->
        <section class="project-grid">
            {% for project in site.projects %}
            <article class="project-card fade-in">
                <!-- Automatically fetch the image if uploaded, otherwise use a blank placeholder -->
                {% if project.image %}
                <div class="project-image"
                    style="background-image: url('{{ site.baseurl }}{{ project.image }}'); background-size: cover; background-position: center;">
                </div>
                {% else %}
                <div class="project-image"></div>
                {% endif %}

                <div class="project-info">
                    <h2>{{ project.title }}</h2>
                    <p>{{ project.description }}</p>
                    <a href="{{ site.baseurl }}{{ project.url }}" class="btn">View Details</a>
                </div>
            </article>
            {% endfor %}
        </section>
    </main>

    <footer>
        <p><a href="mailto:your@email.com">Contact Me</a> | <a href="link-to-cv.pdf">Download CV</a></p>
    </footer>

    <script src="assets/js/script.js"></script>
</body>

</html>
