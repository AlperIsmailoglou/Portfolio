backend:
  name: github
  repo: AlperIsmailoglou/Portfolio
  branch: main
  auth_methods: [token]

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "projects"
    label: "Projects"
    folder: "_projects"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Project Title", name: "title", widget: "string"}
      - {label: "Cover Image", name: "image", widget: "image", required: false}
      - {label: "Short Description", name: "description", widget: "text"}
      - {label: "Full Details (Optional)", name: "body", widget: "markdown", required: false}