<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Portfolio</title>
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
</head>
<body>
    <main class="section-padding" style="max-width: 900px;">
        <a href="{{ site.baseurl }}/#work" class="btn" style="margin-bottom: 2rem;">&larr; Back to Portfolio</a>
        
        <h1 style="margin-bottom: 1rem; font-size: 2.5rem;">{{ page.title }}</h1>
        <span style="display: inline-block; background: #e2e8f0; padding: 0.25rem 0.75rem; border-radius: 4px; margin-bottom: 2rem;">{{ page.category }}</span>
        
        <!-- DETAIL PAGE GALLERY -->
        {% if page.gallery.size > 0 %}
        <div class="detail-gallery-box image-skeleton">
            <button class="slider-btn prev-btn detail-prev">&#10094;</button>
            <div class="detail-images-wrapper">
                {% for item in page.gallery %}
                <img src="{{ site.baseurl }}{{ item.image }}" class="detail-img {% if forloop.first %}active{% endif %}" alt="Project screenshot">
                {% endfor %}
            </div>
            <button class="slider-btn next-btn detail-next">&#10095;</button>
        </div>
        {% endif %}
        
        <div class="project-content" style="margin-top: 3rem;">
            {{ content }}
        </div>
    </main>

    <!-- FULLSCREEN LIGHTBOX MODAL -->
    <div id="lightbox-modal" class="modal-backdrop hidden" style="z-index: 2000;">
        <button id="close-lightbox" class="close-btn" style="color: white;">&times;</button>
        <img id="lightbox-img" src="" alt="Fullscreen view" style="max-width: 90vw; max-height: 90vh; object-fit: contain;">
    </div>

    <script src="{{ site.baseurl }}/assets/js/script.js"></script>
</body>
</html>
